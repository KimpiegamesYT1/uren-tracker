<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Uren Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.84" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#90CAF9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#90CAF9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.06" cy="0.98" r="0.5">
      <stop offset="0" stop-color="#A5D6A7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A5D6A7" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glowBlue)"/>
  <rect width="1280" height="400" fill="url(#glowGreen)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Left: wordmark -->
    <g transform="translate(90 108)">
      <text x="0" y="0" fill="#90CAF9" font-size="13" font-weight="700" letter-spacing="3.5">EXPO &#8226; REACT NATIVE &#8226; SQLITE</text>
      <text x="-3" y="70" fill="#EAEAEA" font-size="64" font-weight="800" letter-spacing="-1.5">Uren Tracker</text>
      <text x="0" y="116" fill="#9A9A9A" font-size="20" font-weight="400">Je uren, onkosten en betalingen &#8212; lokaal op je telefoon,</text>
      <text x="0" y="144" fill="#9A9A9A" font-size="20" font-weight="400">zonder account en zonder cloud.</text>

      <g transform="translate(0 182)" font-size="13.5" font-weight="600">
        <g>
          <rect x="0" y="0" width="146" height="34" rx="17" fill="#1D1D1D" stroke="#2C2C2C"/>
          <text x="73" y="22" fill="#CFCFCF" text-anchor="middle">Kloppend saldo</text>
        </g>
        <g transform="translate(158 0)">
          <rect x="0" y="0" width="162" height="34" rx="17" fill="#1D1D1D" stroke="#2C2C2C"/>
          <text x="81" y="22" fill="#CFCFCF" text-anchor="middle">Tarief per dienst</text>
        </g>
        <g transform="translate(332 0)">
          <rect x="0" y="0" width="128" height="34" rx="17" fill="#1D1D1D" stroke="#2C2C2C"/>
          <text x="64" y="22" fill="#CFCFCF" text-anchor="middle">PDF-export</text>
        </g>
      </g>
    </g>

    <!-- Right: balance card -->
    <g transform="translate(824 64)">
      <!-- dim row peeking out below -->
      <rect x="18" y="214" width="380" height="56" rx="12" fill="#181818"/>
      <rect x="18" y="214" width="4" height="56" rx="2" fill="#F28B82" opacity="0.55"/>
      <rect x="36" y="234" width="150" height="9" rx="4.5" fill="#2B2B2B"/>
      <rect x="36" y="249" width="90" height="8" rx="4" fill="#242424"/>
      <rect x="336" y="230" width="46" height="11" rx="5.5" fill="#2B2B2B"/>
      <rect x="352" y="249" width="30" height="8" rx="4" fill="#242424"/>

      <!-- card -->
      <g filter="url(#cardShadow)">
        <rect x="0" y="0" width="400" height="230" rx="22" fill="#1D1D1D" stroke="#2B2B2B"/>
      </g>
      <text x="30" y="44" fill="#9A9A9A" font-size="11.5" font-weight="700" letter-spacing="1.8">NOG TE ONTVANGEN</text>
      <text x="28" y="106" fill="#EDEDED" font-size="50" font-weight="800" letter-spacing="-1">&#8364;&#160;165,38</text>
      <rect x="30" y="136" width="214" height="46" rx="12" fill="#90CAF9"/>
      <text x="137" y="165" fill="#121212" font-size="15.5" font-weight="700" text-anchor="middle">Betaling ontvangen</text>
    </g>
  </g>
</svg>
